[package]
name    = "aargau-manager"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
autobins   = false
autoexamples = false
autotests  = false
autobenches = false

[lib]
crate-type = ["cdylib", "lib"]
name = "aargau_manager"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl  = { workspace = true }
solana-program = { workspace = true }
borsh = "1.5"

[dev-dependencies]
borsh = "1.5"

[[test]]
name = "integration"
path = "tests/lib.rs"

# Suppress lints triggered by Anchor's procedural macros (`#[program]`,
# `#[derive(Accounts)]`). Both originate from generated code we don't own:
#   - `unexpected_cfgs`: Anchor emits `#[cfg(feature = "anchor-debug")]`,
#     a feature this crate does not declare.
#   - `clippy::diverging_sub_expression`: emitted by `#[program]` expansion.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("anchor-debug"))'] }

[lints.clippy]
diverging_sub_expression = "allow"
