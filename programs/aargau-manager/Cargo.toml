[package]
name    = "aargau-manager"
version = "0.1.0"
edition = "2021"
autobins   = false
autoexamples = false
autotests  = false
autobenches = false

[lib]
crate-type = ["cdylib", "lib"]
name = "aargau_manager"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl  = { workspace = true }
solana-program = { workspace = true }
borsh = "1.5"

[dev-dependencies]
borsh = "1.5"

[[test]]
name = "integration"
path = "tests/lib.rs"
